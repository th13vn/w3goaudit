meta:
  id: CANDIDATE-V4-MANAGER-CALLBACK
  title: "V4 callback without proven expected manager"
  severity: HIGH
  confidence: MEDIUM
  description: "Candidate detector for V4-style callbacks without an exact expected-principal guard."
  recommendation: "Require the exact manager identity before processing callback arguments."
query:
  select: function
  from: entry_function
  where:
    - func_name: '(?i)^(before|after)(Initialize|AddLiquidity|RemoveLiquidity|Swap|Donate)$'
    - not:
        attr:
          auth_verdict: protected
          auth_principal: expected_external
          auth_expected_principal: '(?i)^manager$'
          auth_dominates: dominates
