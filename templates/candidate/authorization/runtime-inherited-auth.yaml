meta:
  id: CANDIDATE-RUNTIME-INHERITED-AUTH
  title: "Runtime inherited authorization evidence"
  severity: INFO
  confidence: HIGH
  description: "Evidence-only candidate for virtual authorization dispatch."
  recommendation: "Review the selected runtime implementation and exact guard evidence."
query:
  select: function
  from: entry_function
  where:
    - attr:
        auth_verdict: protected
        auth_dominates: dominates
        auth_reason: '(virtual_override|super)\.guard\.proven'
