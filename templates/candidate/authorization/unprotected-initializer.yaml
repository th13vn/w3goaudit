meta:
  id: CANDIDATE-UNPROTECTED-INITIALIZER
  title: "Initializer with unproven first-call safety"
  severity: HIGH
  confidence: MEDIUM
  description: "Candidate detector using deterministic authorization/lifecycle facts."
  recommendation: "Prove atomic initialization and deployment ownership, or apply a one-time initializer guard and initialize atomically."
query:
  select: function
  from: entry_function
  where:
    - initializer:
        entry: true
        takeover: [possible, unknown]
    - not:
        authorization:
          protected: true
