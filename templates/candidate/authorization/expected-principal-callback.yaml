meta:
  id: CANDIDATE-EXPECTED-PRINCIPAL-CALLBACK
  title: "Callback without proven expected principal"
  severity: HIGH
  confidence: MEDIUM
  description: "Candidate callback detector requiring an exact expected-principal guard."
  recommendation: "Compare msg.sender with the exact external counterparty before processing callback data."
query:
  select: function
  from: entry_function
  where:
    - func_name: '(?i)^(uniswapV2Call|uniswapV3SwapCallback|uniswapV3FlashCallback|uniswapV3MintCallback)$'
    - not:
        preset:
          authorization:
            type: protected
            principal: [pool, pair]
