meta:
  id: CRITICAL-DELEGATECALL-USER-INPUT
  title: Delegatecall to user-controlled address
  severity: CRITICAL
  confidence: MEDIUM
  description: >
    A delegatecall is executed with a target address controlled by the caller,
    either through a function parameter or caller identity. An attacker can supply
    a malicious contract address as the target, which will execute arbitrary code
    in this contract's context and can drain funds or corrupt storage.
  recommendation: >
    Never delegatecall to user-supplied addresses. Maintain a whitelist of trusted
    implementation addresses, or use an upgradeable proxy pattern with a timelocked
    admin role for changing the implementation.
  references:
    - https://swcregistry.io/docs/SWC-112
    - https://consensys.github.io/smart-contract-best-practices/attacks/delegatecall/

query:
  from: entry_function
  select: delegatecall
  where:
    - not:
        preset:
          authorization:
            type: protected
    # Transparent and immutable-admin proxy dispatch:
    # `modifier ifAdmin() { if (msg.sender == admin) { _; } else { _fallback(); } }`.
    # A non-admin caller never reaches the body, but the authorization facts
    # accept only an `if` whose other arm reverts, so this guard reads as
    # absent. The principal must not itself be caller-controlled, which keeps
    # `if (msg.sender == tx.origin) { _; }` (an EOA filter) reported.
    - not:
        guarded_by:
          has:
            and:
              - block: if
              - has:
                  block: binary
                  operator: "^==$"
                  any:
                    - and:
                        - left:
                            tainted: sender
                        - right:
                            not:
                              tainted: user_controlled
                    - and:
                        - right:
                            tainted: sender
                        - left:
                            not:
                              tainted: user_controlled
              - has:
                  block: identifier
                  name: ^_$
    # Match the delegatecall's own receiver. A descendant search could match a
    # nested receiver inside encoded arguments instead of the actual target.
    - receiver:
        tainted: user_controlled
