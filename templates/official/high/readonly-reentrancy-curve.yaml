meta:
  id: HIGH-READONLY-REENTRANCY-CURVE
  title: "Read-Only Reentrancy via Curve get_virtual_price"
  severity: HIGH
  confidence: MEDIUM
  description: >
    A Curve pool's `get_virtual_price()` is read without first proving the pool
    is not mid-reentrancy. Curve's `remove_liquidity` sends ETH to the caller
    BEFORE it updates `totalSupply`, so a receive() hook observes a pool whose
    balances have shrunk while supply has not. `get_virtual_price` is therefore
    inflated for the duration of the callback. Any integrator that prices
    collateral, mints shares, or computes a swap rate from that value inside the
    callback can be drained — the pool itself is never modified, which is why
    this class is called read-only reentrancy and why a `nonReentrant` modifier
    on YOUR function does not help.
  recommendation: >
    Before reading `get_virtual_price()`, force a revert if the pool is in a
    reentrant state — call the pool's own reentrancy-locked no-op (for example
    `remove_liquidity(0, [0, 0])` or `claim_admin_fees()`), or use a
    Curve-provided reentrancy check. Do not rely on your own `nonReentrant`
    modifier; the attacker never re-enters your contract.
  references:
    - https://chainsecurity.com/curve-lp-oracle-manipulation-post-mortem/
    - https://docs.curve.fi/security/security/

query:
  from: function
  select: external_call

  where:
    - name: '^get_virtual_price$'
    # Reading the price is safe when the same function first pokes a
    # reentrancy-locked pool entry point, which reverts inside a callback.
    - and:
        - not:
            regex: 'remove_liquidity\s*\('
        - not:
            regex: 'claim_admin_fees\s*\('
