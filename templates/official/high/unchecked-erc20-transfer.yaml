meta:
  id: HIGH-UNCHECKED-ERC20-TRANSFER
  title: "Unchecked ERC20 transfer or transferFrom return value"
  severity: HIGH
  confidence: MEDIUM
  description: >
    A call to ERC20 `transfer(...)` or `transferFrom(...)` is made but its
    boolean return value is discarded or captured without a proven check.
    Non-reverting ERC20s (USDT, BNB, ZRX, early OZ) signal failure by returning
    `false`, so an unchecked result silently passes failure upstream and corrupts
    internal accounting.
    Equivalent to Slither's unchecked-transfer detector.
  recommendation: >
    Use OpenZeppelin's `SafeERC20.safeTransfer` / `safeTransferFrom`, which
    revert on failure, or wrap the call: `require(token.transfer(to, amt),
    "transfer failed")`.
  references:
    - https://github.com/crytic/slither/wiki/Detector-Documentation#unchecked-transfer
    - https://docs.soliditylang.org/en/latest/security-considerations.html#use-the-checks-effects-interactions-pattern

# Match external ERC20 transfer calls. Built-in ETH transfer has a separate AST
# kind, so selecting `external_call` excludes it. The semantic result facts
# report only discarded results or captured results without a proven check; an
# assignment alone is not a safety proof.
query:
  from: entry_function
  select: external_call
  where:
    # ERC20 arity: `transfer(to, amount)` and `transferFrom(from, to, amount)`.
    # A multi-token ledger's `transfer(to, id, amount)` shares the name but not
    # the boolean-return contract. `arg.N: {not: {block: function}}` is an
    # existence test: no call argument is a function declaration.
    - any:
        - and:
            - name: ^transfer$
            - not:
                arg.2:
                  not:
                    block: function
        - and:
            - name: ^transferFrom$
            - not:
                arg.3:
                  not:
                    block: function
    - any:
        - and:
            - boundary_result_disposition: ^discarded$
            - boundary_result_checked: ^no$
        - and:
            - boundary_result_disposition: ^captured$
            - boundary_result_checked: ^no$
