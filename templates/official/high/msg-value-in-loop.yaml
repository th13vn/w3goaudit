meta:
  id: HIGH-MSG-VALUE-IN-LOOP
  title: "msg.value effect repeats inside a loop"
  severity: HIGH
  confidence: MEDIUM
  description: >
    Transaction-level `msg.value` reaches a persistent state write, an ETH-
    bearing call, or an exact stateful helper inside a loop that may execute
    more than once. `msg.value` does not decrement as the loop iterates, so the
    same value can be accounted for or transferred repeatedly.
  recommendation: >
    Pass an explicit `amounts[]` array alongside `users[]` and require
    `sum(amounts) == msg.value`. Ensure each iteration consumes a distinct
    amount instead of reusing the full transaction value.
  references:
    - https://github.com/crytic/slither/wiki/Detector-Documentation#msg-value-inside-a-loop
    - https://forum.openzeppelin.com/t/poc-multicall-with-msg-value-reuses-eth/14467

# The loop stays a structural report anchor. Positive semantic attributes live
# on the exact source and effect nodes below it.
query:
  from: entry_function
  select: loop
  where:
    - and:
        - mutability: payable
    - has:
        attr:
          transaction_context_source: ^msg_value$
          transaction_context_use: ^(state_write|call_value|stateful_internal_call)$
          transaction_context_repeatability: ^possible$
