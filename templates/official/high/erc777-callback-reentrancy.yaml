meta:
  id: HIGH-ERC777-CALLBACK-REENTRANCY
  title: "ERC777 tokensReceived Callback Reentrancy"
  severity: HIGH
  confidence: MEDIUM
  description: >
    An unguarded entry point invokes an ERC777 `tokensReceived` hook. Unlike
    ERC20, an ERC777 transfer calls into the recipient (and sender) on every
    movement, so any contract that treats `transfer`/`transferFrom` as inert is
    wrong for ERC777 tokens. The hook runs before the caller's own post-transfer
    accounting, which makes deposit/withdraw pairs reenterable even though no ETH
    is involved. This is the imBTC / Uniswap V1 incident class.
  recommendation: >
    Add a `nonReentrant` modifier and complete all state updates before the
    transfer. If ERC777 support is not required, reject tokens implementing the
    ERC1820 `ERC777Token` interface, or restrict the contract to a vetted token
    allowlist.
  references:
    - https://github.com/crytic/slither/wiki/Detector-Documentation#reentrancy-vulnerabilities
    - https://eips.ethereum.org/EIPS/eip-777

query:
  from: entry_function
  select: external_call

  where:
    - not: { preset: reentrancy_guarded }
    - name: '^tokensReceived$'
