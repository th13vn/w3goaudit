meta:
  id: HIGH-READONLY-REENTRANCY-BALANCER
  title: "Read-Only Reentrancy via Balancer Vault getPoolTokens"
  severity: HIGH
  confidence: MEDIUM
  description: >
    A Balancer Vault composition view (`getPoolTokens`) is read without first
    proving the Vault is not mid-reentrancy. Balancer's
    Vault performs token transfers before settling its internal accounting, so a
    token hook or ETH receive() observes inconsistent balances. Values derived
    from that read — LP prices, rates, collateral valuations — are wrong for the
    duration of the callback, and a `nonReentrant` modifier on your own function
    does not prevent it because the attacker never re-enters your contract.
  recommendation: >
    Call `VaultReentrancyLib.ensureNotInVaultContext(vault)` before any Vault
    read used for pricing, or route the read through
    `vault.manageUserBalance(...)` with an empty operation set, which reverts
    inside the Vault's reentrancy guard.
    The sibling `getRate()` variant is intentionally NOT shipped: `getRate` is a
    ubiquitous name for any rate provider (Shell/Curve `Assimilators.getRate`
    triggered it three times in one real scan), so the bare name cannot identify a
    Balancer read. It remains in the benchmark lane, where the corpus pins the
    receiver.
  references:
    - https://forum.balancer.fi/t/reentrancy-vulnerability-scope-expanded/4345
    - https://github.com/balancer/balancer-v2-monorepo/blob/master/pkg/pool-utils/contracts/lib/VaultReentrancyLib.sol

query:
  from: function
  select: external_call
  where:
    - name: '^getPoolTokens$'
    - and:
        - not:
            regex: 'VaultReentrancyLib\.ensureNotInVaultContext\s*\('
        - not:
            regex: '\.manageUserBalance\s*\('
