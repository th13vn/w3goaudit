meta:
  id: MEDIUM-UNCHECKED-ARITHMETIC
  title: Arithmetic in unchecked block (potential overflow)
  severity: MEDIUM
  confidence: LOW
  description: >
    Arithmetic operations (+ - * /) are performed inside an unchecked block of
    a STATE-MUTATING function compiled with Solidity >=0.8.0. The unchecked
    keyword removes the automatic overflow/underflow protection added in 0.8.0,
    so an overflow silently wraps instead of reverting — dangerous when it feeds
    persistent accounting (balances, totalSupply, shares). Pure/view functions
    are excluded: they cannot corrupt state, and overflow there is the
    deliberate, audited idiom used by library math such as OpenZeppelin
    `SafeMath.tryAdd`, `Math.mulDiv`, `Math.log10` and `Strings.toString`. This
    scoping removes the bulk of the false positives this detector raised on
    vendored libraries while keeping real stateful-accounting overflows.
    Subtractions are reported unless a preceding guard bounds them; products
    and sums only when an operand is caller-controlled, and sums not when they
    step by a constant.
  recommendation: >
    Remove the unchecked block if overflow/underflow protection is needed.
    If unchecked is used intentionally for gas optimization, add a comment
    explaining why it is safe, and add an explicit bounds check before the
    unchecked block.
  references:
    - https://swcregistry.io/docs/SWC-101
    - https://docs.soliditylang.org/en/latest/control-structures.html#checked-or-unchecked-arithmetic

query:
  from: function
  # Anchor on the arithmetic operation so the report identifies the risky
  # expression rather than the enclosing unchecked block.
  select: binary
  where:
    - version: ">=0.8.0"
    # Restrict the detector to state-mutating functions; pure/view arithmetic
    # cannot corrupt persistent accounting. `and:` routes mutability to the
    # function-level precondition.
    - and:
        - mutability: "payable,nonpayable"

    # The operation must sit inside an explicit `unchecked` block; ordinary checked
    # arithmetic reverts on overflow and is not a finding.
    - in:
        block: unchecked

    # Division cannot overflow, so only exploit-relevant arithmetic is included.
    - any:
        # Subtraction can underflow even with a constant operand.
        - operator: "[-]"
        # Multiplication and addition are included only when an operand is
        # caller-controlled. Products and sums of contract-held values were
        # bounded by construction on every corpus site (bitmap offsets
        # `(b % 8) * 32`, constant rescales, packed counters), and routine
        # counter and nonce increments are not useful attacker-controlled
        # wraps. Check an operand directly: a descendant search could mistake
        # a caller-controlled mapping key for a caller-controlled operand.
        - and:
            - operator: "[*]"
            - any:
                - left: { tainted: user_controlled }
                - right: { tainted: user_controlled }
        - and:
            - operator: "[+]"
            - any:
                - left: { tainted: user_controlled }
                - right: { tainted: user_controlled }
            # `x + 1` and `q + (exact ? 0 : 1)` step by a constant.
            - not:
                left:
                  block: literal
            - not:
                right:
                  block: literal
            - not:
                right:
                  block: ternary
                  not:
                    has:
                      conditional_part: '^(true|false)$'
                      not:
                        block: literal

    # `gasBefore - gasleft()` cannot underflow: gasleft() only decreases
    # during execution, so the earlier reading is never smaller.
    - not:
        right:
          name: "^gasleft$"

    # Exclude operations whose operands are bounded by a preceding guard.
    - unchecked_var:
