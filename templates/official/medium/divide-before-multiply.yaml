meta:
  id: MEDIUM-DIVIDE-BEFORE-MULTIPLY
  title: "Division before multiplication (precision loss)"
  severity: MEDIUM
  confidence: LOW
  description: >
    A division (`/`) is the LEFT operand of a multiplication (`*`) in the same
    expression — e.g. `(supply / n) * rate`. Solidity integer division truncates
    toward zero, so dividing first loses precision the multiplication cannot
    recover. The classical example is `(5 / 10) * 2 == 0`, whereas
    `(5 * 2) / 10 == 1`. In DeFi this typically manifests as zero-yield bugs,
    rounding-down rewards, or LP share-mint loss-of-precision exploits.
    Equivalent to Slither's divide-before-multiply detector. Overflow
    fallbacks that divide first only above a 1e30+ magnitude check are not
    reported.
  recommendation: >
    Reorder so multiplication happens first: `(supply * rate) / n`. For
    fractional fixed-point math use a scaling factor (e.g. 1e18) or a tested
    fixed-point library (FullMath, FixedPoint96, PRBMath).
  references:
    - https://github.com/crytic/slither/wiki/Detector-Documentation#divide-before-multiply
    - https://docs.soliditylang.org/en/latest/types.html#division

query:
  from: function
  select: binary
  where:
    # Match a multiplication whose left operand is a division. Direct child
    # matching preserves operand order and avoids unrelated expressions.
    - operator: "\\*"
    - left:
        block: binary
        operator: "/"
    - not:
        attr:
          intentional_divide_rounding: true
    # Overflow fallback: the divide-first form sits under an if or ternary
    # whose condition compares with a magnitude of 1e30 or more, as in Fluid's
    # `p < 1e50 ? (p * 1e27) / q : (p / q) * 1e27`. Multiply-first would
    # overflow there, so dividing first is the deliberate choice.
    - not:
        in:
          any:
            - block: if
              has:
                cond_role: '^if$'
                any:
                  - block: binary
                    operator: '^(<|<=|>|>=)$'
                    has:
                      block: literal
                      name: '^1e([3-6][0-9]|7[0-7])$'
                  - has:
                      block: binary
                      operator: '^(<|<=|>|>=)$'
                      has:
                        block: literal
                        name: '^1e([3-6][0-9]|7[0-7])$'
            - block: ternary
              has:
                conditional_part: '^condition$'
                any:
                  - block: binary
                    operator: '^(<|<=|>|>=)$'
                    has:
                      block: literal
                      name: '^1e([3-6][0-9]|7[0-7])$'
                  - has:
                      block: binary
                      operator: '^(<|<=|>|>=)$'
                      has:
                        block: literal
                        name: '^1e([3-6][0-9]|7[0-7])$'
    # A compile-time constant such as `(type(uint256).max / 10 ** 36) * 10 ** 18`
    # is an intentional bound, not a runtime precision loss: require at least
    # one variable in the expression.
    - has:
        block: identifier
