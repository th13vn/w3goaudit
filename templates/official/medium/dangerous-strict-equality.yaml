meta:
  id: MEDIUM-DANGEROUS-STRICT-EQUALITY
  title: "Dangerous strict equality on externally influenced balance"
  severity: MEDIUM
  confidence: MEDIUM
  description: >
    A strict equality (`==` or `!=`) is applied to a value that can be
    externally manipulated — most commonly `address(this).balance` or an
    ERC20 `balanceOf(...)` read. ETH balance can be force-incremented by
    a `selfdestruct(payable(victim))` from any external contract, defeating
    any `balance == X` guard. ERC20 balance can shift between blocks via
    transfers or rebasing. Logic that depends on EXACT balances is therefore
    brittle and exploitable. A caller-supplied value compared strictly with
    `block.timestamp` or `block.number` hands the block producer the same
    lever. Same-transaction deltas (`balanceOf(this) - before == amount`) and
    struct fields that are merely named `balance` or `timestamp` are not
    reported. Equivalent to Slither's incorrect-equality detector.
  recommendation: >
    Use `>=` or `<=` comparisons instead. Treat balances as a lower bound, not
    an exact value. If exact value matters, snapshot it into a state variable
    you control.
  references:
    - https://github.com/crytic/slither/wiki/Detector-Documentation#dangerous-strict-equalities
    - https://swcregistry.io/docs/SWC-132

# Match strict equality whose expression contains a balance-like read; the side
# of the comparison does not matter. Clock checks require the block value and a
# caller-supplied parameter as the two operands, so same-block caches compared
# against stored state are safe.
query:
  from: function
  select: binary
  where:
    - operator: "(==|!=)"
    - any:
        # A balance an outsider can move with a transfer or a donation. A
        # struct field that happens to be named `balance` is the contract's
        # own accounting.
        - has:
            block: member
            name: ^balance$
            not:
              left:
                type_kind: '^struct$'
        - has: { block: external_call, name: ^balanceOf$ }
        # The block clock compared strictly with a caller-supplied value. Both
        # must be the direct operands: a block number hashed into a same-block
        # guard, a struct field named `timestamp`, and a contract-written
        # cache (state-derived, or an internal helper's parameter) give the
        # caller no lever.
        - and:
            - any:
                - left: { block: member, name: '^(timestamp|number)$', parent: '^block$' }
                - right: { block: member, name: '^(timestamp|number)$', parent: '^block$' }
            - any:
                - left: { and: [ { tainted: parameter }, { not: { tainted: state_var } } ] }
                - right: { and: [ { tainted: parameter }, { not: { tainted: state_var } } ] }
            - in: { block: function, visibility: 'public,external' }
    # A same-transaction delta (`balanceOf(this) - before == amount`) checks
    # what this call moved, which a donation before the call cannot change.
    - not:
        any:
          - left: { block: binary, operator: "-" }
          - right: { block: binary, operator: "-" }
